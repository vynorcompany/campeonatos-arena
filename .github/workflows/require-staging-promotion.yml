name: Require pull request release

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  release-source:
    runs-on: ubuntu-latest
    env:
      SOURCE_BRANCH: ${{ github.head_ref }}
    steps:
      - name: Confirm a release source was provided
        run: test -n "$SOURCE_BRANCH"
