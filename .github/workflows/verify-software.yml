name: Verify software

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: arena_goal
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arena_goal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:55433/arena_goal?schema=public
      DIRECT_URL: postgresql://postgres@127.0.0.1:55433/arena_goal?schema=public
      ARENA_GOAL_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:55433/arena_goal?schema=public
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:setup
      - run: npx tsx scripts/seed-goal-ci.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
