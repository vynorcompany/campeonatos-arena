name: Verify software

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: arena_goal
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arena_goal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:55433/arena_goal?schema=public
      DIRECT_URL: postgresql://postgres@127.0.0.1:55433/arena_goal?schema=public
      ARENA_GOAL_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:55433/arena_goal?schema=public
      ARENA_GOAL_TEST_SESSION_TOKEN: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run db:generate
      - run: npm run db:setup
      - run: npx tsx scripts/seed-goal-ci.ts
      - name: Preview recurring charges without issuing payments
        run: npx tsx scripts/preview-financial-online-charges.ts --preview
      - run: npm run typecheck
      - run: npm run build
      - name: Start isolated app
        run: |
          PORT=3011 HOSTNAME=127.0.0.1 npm run start > /tmp/arena-goal-server.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3011/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/arena-goal-server.log
          exit 1
      - name: Reject unauthenticated API access
        run: node scripts/unauthenticated-api-smoke-ci.mjs
      - name: Visual smoke in Edge
        run: node scripts/visual-smoke-ci.mjs
      - run: npm test
      - name: Load 100 synthetic arenas and verify isolation
        run: node scripts/load-100-arenas-ci.mjs
      - name: Save synthetic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-smoke-synthetic
          path: artifacts/visual-smoke/*.png
          if-no-files-found: ignore
          retention-days: 3
