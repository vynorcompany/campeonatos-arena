<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1067" viewBox="80 20 900 400" role="img" aria-labelledby="title desc">
  <title id="title">VX4</title>
  <desc id="desc">Marca VX4 com fita branca e azul e numeral quatro verde elevado. Fundo transparente. Desenho integralmente vetorial.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="1" x2="0.65" y2="0">
      <stop stop-color="#00d5f5"/>
      <stop offset=".38" stop-color="#009aff"/>
      <stop offset=".72" stop-color="#0759ef"/>
      <stop offset="1" stop-color="#03268c"/>
    </linearGradient>
    <linearGradient id="back" x1=".1" y1="1" x2=".8" y2="0">
      <stop stop-color="#091d32"/>
      <stop offset=".4" stop-color="#19334f"/>
      <stop offset=".77" stop-color="#243e5c"/>
      <stop offset="1" stop-color="#213d59"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2=".25" y2="1">
      <stop stop-color="#243e5c"/>
      <stop offset=".3" stop-color="#223b58"/>
      <stop offset=".61" stop-color="#132b45"/>
      <stop offset=".85" stop-color="#28445f"/>
      <stop offset="1" stop-color="#0b2038"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2=".55">
      <stop stop-color="#0a1d33"/>
      <stop offset=".42" stop-color="#18324e"/>
      <stop offset="1" stop-color="#243e5c"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2=".6" y2="1">
