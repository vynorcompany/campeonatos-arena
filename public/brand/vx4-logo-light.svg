    <path fill="url(#blue)" stroke="#009bec" stroke-width="1" d="M335 380 C384 352 437 295 481 255 C510 229 529 222 554 229 C581 237 603 263 628 288 C602 291 577 303 554 324 L511 364 C494 380 480 385 451 385 L334 385 C330 385 331 383 335 380Z"/>
    <path fill="url(#front)" stroke="#24405c" stroke-width="1.2" d="M102 122 C121 112 164 111 187 120 C198 124 203 134 209 146 L282 287 C287 297 294 302 302 302 C314 302 322 290 330 276 L398 160 C421 119 450 108 484 110 C519 112 545 135 571 160 L716 303 C743 330 774 353 812 361 C793 377 774 385 750 385 C715 385 686 369 662 346 L500 189 C489 178 479 171 468 172 C455 173 446 183 438 197 L361 327 C340 364 319 385 290 385 C256 385 232 365 214 332 L101 139 C96 130 96 126 102 122Z"/>
    <path fill="url(#fold)" d="M398 160 C421 119 450 108 484 110 C510 112 531 125 550 141 C527 133 506 136 489 149 C478 157 470 166 463 173 C453 176 445 185 438 197 L391 276 C397 247 411 218 428 190 C439 173 454 160 469 157 C444 141 422 143 398 160Z" opacity=".68"/>
