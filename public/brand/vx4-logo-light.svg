    <path fill="url(#lime)" stroke="#b5ef10" stroke-width=".7" fill-rule="evenodd" d="M916 38 L948 38 L918 151 L951 151 L945 174 L912 174 L900 219 L874 219 L886 174 L796 174 L802 150 Z M906 76 L831 151 L892 151 Z"/>
